name: Flask CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Werkzeug==0.16.1 MarkupSafe==1.1.1 SQLAlchemy==1.3.24

      - name: Validate Python files
        run: |
          python -m compileall -q application manage.py

      - name: Initialize SQLite database
        run: |
          python -c "import sqlite3; db=sqlite3.connect('todo.sqlite'); db.execute('SELECT 1'); db.close()"

      - name: Smoke test Flask server
        run: |
          python manage.py runserver > flask.log 2>&1 &
          SERVER_PID=$!

          for i in {1..30}; do
            if curl --fail http://127.0.0.1:7345/; then
              echo "Flask server is working!"
              kill $SERVER_PID || true
              exit 0
            fi
            sleep 2
          done

          echo "Flask server failed to start"
          cat flask.log
          kill $SERVER_PID || true
          exit 1
